<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="788" viewBox="0 0 1400 788" role="img" aria-labelledby="title desc">
  <title id="title">Tessera dark thumbnail</title>
  <desc id="desc">Dark map styled marketing cover for Tessera with rider pin, driver dots and a 1.4x price chip.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#071a2b"/>
      <stop offset="50%" stop-color="#0f2436"/>
      <stop offset="100%" stop-color="#040d1d"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="1">
      <stop offset="0%" stop-color="#0a2a3f" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0a1d2e" stop-opacity="0.65"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1400" height="788" fill="url(#bg)"/>
  <g opacity="0.18" stroke="#9ad9ff" stroke-width="1">
    <path d="M0 130H1400M0 250H1400M0 370H1400M0 490H1400M0 610H1400M0 730H1400"/>
    <path d="M200 0V788M380 0V788M560 0V788M740 0V788M920 0V788M1100 0V788M1280 0V788"/>
  </g>

  <g opacity="0.25">
    <path d="M120 620C260 560 230 420 370 390C540 350 620 510 760 470C930 430 980 250 1180 290C1260 310 1325 350 1400 380V788H0V700C40 670 70 650 120 620Z" fill="#173754"/>
  </g>

  <g>
    <rect x="94" y="72" width="1212" height="644" rx="30" fill="url(#panel)" stroke="#2d5b7e" opacity="0.72"/>
  </g>

  <g filter="url(#glow)">
    <circle cx="320" cy="430" r="12" fill="#3ad0ff"/>
    <circle cx="400" cy="485" r="12" fill="#48e1b8"/>
    <circle cx="515" cy="400" r="12" fill="#7ae8ff"/>
    <circle cx="585" cy="520" r="12" fill="#b4f3ff"/>
    <circle cx="665" cy="405" r="12" fill="#59c2ff"/>
    <circle cx="830" cy="430" r="12" fill="#3ad0ff"/>
    <circle cx="980" cy="510" r="12" fill="#48e1b8"/>
    <circle cx="1100" cy="430" r="12" fill="#7ae8ff"/>
  </g>

  <g>
    <circle cx="930" cy="360" r="72" fill="none" stroke="#7ce7ff" stroke-opacity="0.8" stroke-width="5"/>
    <circle cx="930" cy="360" r="40" fill="none" stroke="#7ce7ff" stroke-opacity="0.5" stroke-width="3"/>
    <path d="M930 280L930 440M858 360H1002" stroke="#7ce7ff" stroke-opacity="0.66" stroke-width="2"/>
    <path d="M930 360L1008 288" stroke="#7ce7ff" stroke-opacity="0.5" stroke-width="2"/>
    <circle cx="930" cy="360" r="16" fill="#97f0ff"/>
  </g>

  <g>
    <path d="M690 500C690 465 718 436 753 436C788 436 816 465 816 500C816 559 753 602 753 602C753 602 690 560 690 500Z" fill="#ec5c8a"/>
    <circle cx="753" cy="492" r="22" fill="#ffdfe7"/>
    <circle cx="753" cy="492" r="6" fill="#ec5c8a"/>
  </g>

  <g>
    <rect x="965" y="140" width="220" height="76" rx="18" fill="#0c1d2d" stroke="#3ad0ff" opacity="0.88"/>
    <text x="985" y="190" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#dff9ff">1.4x</text>
  </g>

  <g>
    <text x="118" y="218" font-family="Arial, sans-serif" font-size="110" font-weight="700" fill="#f3fbff">Tessera</text>
    <text x="122" y="300" font-family="Arial, sans-serif" font-size="42" font-weight="400" fill="#a4d6f7" letter-spacing="1.5">Dispatch, priced in the open</text>
  </g>

